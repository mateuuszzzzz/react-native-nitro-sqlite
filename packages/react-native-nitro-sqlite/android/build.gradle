buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["RNNitroSQLite_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RNNitroSQLite_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RNNitroSQLite_" + name]).toInteger()
}

def safeAppExtGet(prop, fallback) {
  def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }
  appProject?.ext?.has(prop) ? appProject.ext.get(prop) : fallback
}

def resolveBuildType() {
  Gradle gradle = getGradle()
  String tskReqStr = gradle.getStartParameter().getTaskRequests()['args'].toString()
  return tskReqStr.contains('Release') ? 'release' : 'debug'
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

def resolveReactNativeDirectory() {
  def reactNativeLocation = safeAppExtGet("REACT_NATIVE_NODE_MODULES_DIR", null)
  if (reactNativeLocation != null) {
    return file(reactNativeLocation)
  }

  // Fallback to node resolver for custom directory structures like monorepos.
  def reactNativePackage = file(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim())
  if (reactNativePackage.exists()) {
    return reactNativePackage.parentFile
  }

  throw new GradleException("[react-native-nitro-sqlite] Unable to resolve react-native location in node_modules. Your app should define `REACT_NATIVE_NODE_MODULES_DIR` extension property in `app/build.gradle` with a path to react-native in node_modules.")
}

def reactNativeRootDir = resolveReactNativeDirectory()
def reactProperties = new Properties()
file("$reactNativeRootDir/ReactAndroid/gradle.properties").withInputStream { reactProperties.load(it) }

def REACT_NATIVE_VERSION = reactProperties.getProperty("VERSION_NAME")
def REACT_NATIVE_MINOR_VERSION = REACT_NATIVE_VERSION.startsWith("0.0.0-") ? 1000 : REACT_NATIVE_VERSION.split("\\.")[1].toInteger()

def SQLITE_FLAGS = rootProject.properties['nitroSqliteFlags']

// --- SQLCipher (optional, opt-in) -----------------------------------------
// Enable with `nitroSqliteSqlcipher=true` in android/gradle.properties. When
// on, the SQLCipher amalgamation is compiled and linked against a prebuilt
// OpenSSL libcrypto downloaded per-ABI (checksum-verified) by `extractOpenSSL`.
def nitroSqliteSqlcipher = (project.findProperty('nitroSqliteSqlcipher') ?: 'false').toString().toBoolean()
def opensslVersion = (project.findProperty('nitroSqliteOpensslVersion') ?: '3.6.2').toString()
def opensslBaseUrl = "https://github.com/arekm213/openssl_for_android/releases/download/${opensslVersion}"
def opensslRoot = file("$buildDir/openssl/$opensslVersion")
// SHA-256 of the asm-enabled per-ABI tarballs. Pinned to the default version;
// if a different version is requested, verification is skipped with a warning.
def opensslSha256 = [
  'arm64-v8a'  : '67ecdfef966a5a7aaea23ed70f99b5e7d6783dce3219a609074fe65199bc719a',
  'armeabi-v7a': '1a3b9e569f92941f26646e9d8e202d557ef2abfe4e213403881c8f99d5b30551',
  'x86'        : 'cb696ce13cf14e7968adea6724a47cdbbae0298d4461e3916a64e3d4b205084c',
  'x86_64'     : '4ab125e5aa1a85b5ac96efa765ee90a922a83269ea57fceb65ec86cd8b63773d',
]

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

apply from: '../nitrogen/generated/android/RNNitroSQLite+autolinking.gradle'

android {
  if (supportsNamespace()) {
    namespace "com.margelo.rnnitrosqlite"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    // Ship keep rules to consuming apps so R8 doesn't strip the JNI-only
    // KeyProvider.resolveKey (see consumer-rules.pro).
    consumerProguardFiles "consumer-rules.pro"

    buildConfigField "int", "REACT_NATIVE_MINOR_VERSION", REACT_NATIVE_MINOR_VERSION.toString()
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared",
          "-DANDROID_TOOLCHAIN=clang",
          "-DREACT_NATIVE_MINOR_VERSION=${REACT_NATIVE_MINOR_VERSION}",
          "-DSQLITE_FLAGS='${SQLITE_FLAGS ? SQLITE_FLAGS : ''}'",
          "-DNITRO_SQLITE_SQLCIPHER=${nitroSqliteSqlcipher ? 'ON' : 'OFF'}",
          "-DNITRO_SQLITE_OPENSSL_ROOT=${opensslRoot.absolutePath}",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version = System.getenv("CMAKE_VERSION") ?: "3.22.1"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += [
        "src/main/kotlin"
      ]

      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch"]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
    }
  }

  packagingOptions {
    doNotStrip resolveBuildType() == 'debug' ? "**/**/*.so" : ''
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libreactnative.so",
      "**/libreact_nativemodule_core.so",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libhermes.so",
    ]
  }
}

// Downloads + verifies + flattens the prebuilt OpenSSL static libs into
// $buildDir/openssl/<version>/<abi>/{include,lib/libcrypto.a}. Only runs when
// SQLCipher is enabled; results are cached on disk and skipped if present.
def extractOpenSSL = tasks.register("extractOpenSSL") {
  onlyIf { nitroSqliteSqlcipher }
  doLast {
    reactNativeArchitectures().each { abi ->
      def abiDir = new File(opensslRoot, abi)
      if (new File(abiDir, "lib/libcrypto.a").exists()) {
        return // already provisioned
      }

      def tarball = new File(opensslRoot, "download/OpenSSL_${opensslVersion}_${abi}.tar.gz")
      tarball.parentFile.mkdirs()
      if (!tarball.exists()) {
        def url = "${opensslBaseUrl}/OpenSSL_${opensslVersion}_${abi}.tar.gz"
        logger.lifecycle("[nitro-sqlite] Downloading OpenSSL ${opensslVersion} (${abi})…")
        ant.get(src: url, dest: tarball, verbose: false)
      }

      def expected = opensslSha256[abi]
      if (expected != null) {
        def md = java.security.MessageDigest.getInstance("SHA-256")
        tarball.eachByte(8192) { buf, n -> md.update(buf, 0, n) }
        def actual = md.digest().collect { String.format('%02x', it) }.join()
        if (actual != expected) {
          throw new GradleException("[nitro-sqlite] OpenSSL ${abi} checksum mismatch.\n  expected: ${expected}\n  actual:   ${actual}")
        }
      } else {
        logger.warn("[nitro-sqlite] No pinned checksum for OpenSSL ${opensslVersion} (${abi}); skipping verification.")
      }

      // Archive layout: openssl_<version>_<abi>/{include,lib}; flatten it up.
      def tmp = new File(opensslRoot, "tmp/${abi}")
      delete(tmp)
      copy {
        from tarTree(resources.gzip(tarball))
        into tmp
      }
      copy {
        from new File(tmp, "openssl_${opensslVersion}_${abi}")
        into abiDir
      }
      delete(tmp)
    }
  }
}

// Make sure OpenSSL is provisioned before CMake configures/builds.
tasks.configureEach { task ->
  if (nitroSqliteSqlcipher && (task.name.startsWith("configureCMake") || task.name.startsWith("buildCMake"))) {
    task.dependsOn(extractOpenSSL)
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // Keystore-backed secure storage for SQLCipher keys (see KeyProvider.kt).
  implementation "androidx.security:security-crypto:1.1.0-alpha06"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RNNitroSQLite"
  }
}
